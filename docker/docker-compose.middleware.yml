# ==========================================
# NODO: MIDDLEWARE (RabbitMQ)
# ==========================================
# Broker de mensajería asíncrona (AMQP) que conecta
# los microservicios de ofertas y multas con el
# servicio de notificaciones.
#
# Puertos expuestos:
#   - 5672  → AMQP (comunicación entre servicios)
#   - 15672 → Management UI (panel de administración web)
#
# Uso:
#   docker compose -f docker-compose.middleware.yml up -d
# ==========================================

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - profeco-net

volumes:
  rabbitmq-data:

networks:
  profeco-net:
    external: true
