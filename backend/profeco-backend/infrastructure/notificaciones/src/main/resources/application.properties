server.port=8090
spring.application.name=notificaciones

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Firebase Admin: ruta dentro del classpath (src/main/resources/serviceAccountKey.json).
# Este archivo NO se commitea (.gitignore: **/serviceAccountKey.json).
profeco.firebase.credentials-path=serviceAccountKey.json

# Cliente gRPC contra ms-usuarios \u00e2\u0080\u0094 para resolver tokens FCM por comercio favorito.
grpc.client.ms-usuarios.address=static://${MS_USUARIOS_HOST:ms-usuarios}:${MS_USUARIOS_GRPC_PORT:9096}
grpc.client.ms-usuarios.negotiation-type=plaintext

# Topic FCM de fallback cuando no hay tokens registrados (solo entorno dev).
profeco.fcm.fallback-topic=ofertas-nuevas

