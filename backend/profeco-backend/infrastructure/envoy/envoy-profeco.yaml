# ==========================================
# CONFIGURACIÓN DE ENVOY PARA: GATEWAY PROFECO (Funcionarios)
# ==========================================
# Incluye: JWT Authentication, Rate Limiting y Transcodificación gRPC.

static_resources:
  listeners:
    - name: listener_profeco
      address:
        socket_address: { address: 0.0.0.0, port_value: 8085 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      cors:
                        allow_origin_string_match:
                          - safe_regex: { regex: "^http://localhost(:[0-9]+)?$" }
                          - safe_regex: { regex: "^http://127\\.0\\.0\\.1(:[0-9]+)?$" }
                        allow_methods: "GET, POST, PUT, DELETE, OPTIONS"
                        allow_headers: "Content-Type, Authorization"
                        max_age: "1728000"
                        expose_headers: "grpc-status, grpc-message"
                      routes:
                        - match: { prefix: "/profeco.auth.v1.AuthService/" }
                          route:
                            cluster: ms-auth
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/api/auth/" }
                          route:
                            cluster: ms-auth
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/profeco.multas.v1.MultasService/" }
                          route:
                            cluster: ms-multas
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/profeco.comercio.v1.ComercioService/" }
                          route:
                            cluster: ms-comercio
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/profeco.catalogo.v1.CatalogoService/" }
                          route:
                            cluster: ms-catalogo
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/profeco.resenias.v1.ReseniasService/" }
                          route:
                            cluster: ms-resenias
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/profeco.usuarios.v1.UsuariosService/" }
                          route:
                            cluster: ms-usuarios
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/api/reportes" }
                          route:
                            cluster: ms-multas
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/api/multas" }
                          route:
                            cluster: ms-multas
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/api/comercios" }
                          route:
                            cluster: ms-comercio
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/api/catalogo" }
                          route:
                            cluster: ms-catalogo
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/api/resenias" }
                          route:
                            cluster: ms-resenias
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/api/usuarios" }
                          route:
                            cluster: ms-usuarios
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors }
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                      token_bucket: { max_tokens: 100, tokens_per_fill: 100, fill_interval: 60s }
                      filter_enabled: { runtime_key: local_rate_limit_enabled, default_value: { numerator: 100, denominator: HUNDRED } }
                      filter_enforced: { runtime_key: local_rate_limit_enforced, default_value: { numerator: 100, denominator: HUNDRED } }
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        profeco_auth:
                          issuer: "profeco-auth-service"
                          forward: true
                          remote_jwks:
                            http_uri: { uri: "http://ms-auth:8098/.well-known/jwks.json", cluster: ms-auth-jwks, timeout: 15s }
                            cache_duration: 300s
                      rules:
                        - match: { prefix: "/api/auth/" }
                        - match: { prefix: "/profeco.auth.v1.AuthService/" }
                        - match: { prefix: "/api/usuarios/ping" }
                        - match: { prefix: "/" }
                          requires: { provider_name: "profeco_auth" }
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: "/etc/envoy/proto/gateway-profeco.pb"
                      services: ["profeco.multas.v1.MultasService","profeco.comercio.v1.ComercioService","profeco.catalogo.v1.CatalogoService","profeco.resenias.v1.ReseniasService","profeco.usuarios.v1.UsuariosService","profeco.auth.v1.AuthService"]
                      print_options: { add_whitespace: true }
                      auto_mapping: true
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
  clusters:
    - name: ms-multas
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options: { envoy.extensions.upstreams.http.v3.HttpProtocolOptions: { "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: { http2_protocol_options: {} } } }
      load_assignment: { cluster_name: ms-multas, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-multas, port_value: 9097 } } } }] }] }
    - name: ms-comercio
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options: { envoy.extensions.upstreams.http.v3.HttpProtocolOptions: { "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: { http2_protocol_options: {} } } }
      load_assignment: { cluster_name: ms-comercio, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-comercio, port_value: 9092 } } } }] }] }
    - name: ms-catalogo
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options: { envoy.extensions.upstreams.http.v3.HttpProtocolOptions: { "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: { http2_protocol_options: {} } } }
      load_assignment: { cluster_name: ms-catalogo, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-catalogo, port_value: 9091 } } } }] }] }
    - name: ms-resenias
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options: { envoy.extensions.upstreams.http.v3.HttpProtocolOptions: { "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: { http2_protocol_options: {} } } }
      load_assignment: { cluster_name: ms-resenias, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-resenias, port_value: 9094 } } } }] }] }
    - name: ms-usuarios
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options: { envoy.extensions.upstreams.http.v3.HttpProtocolOptions: { "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: { http2_protocol_options: {} } } }
      load_assignment: { cluster_name: ms-usuarios, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-usuarios, port_value: 9096 } } } }] }] }
    - name: ms-auth
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options: { envoy.extensions.upstreams.http.v3.HttpProtocolOptions: { "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: { http2_protocol_options: {} } } }
      load_assignment: { cluster_name: ms-auth, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-auth, port_value: 9098 } } } }] }] }
    - name: ms-auth-jwks
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment: { cluster_name: ms-auth-jwks, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-auth, port_value: 8098 } } } }] }] }
