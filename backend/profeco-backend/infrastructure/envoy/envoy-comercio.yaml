# ==========================================
# CONFIGURACIÓN DE ENVOY PARA: GATEWAY COMERCIO
# ==========================================
# Este archivo define cómo Envoy va a recibir peticiones web (HTTP/JSON)
# y las va a traducir y enrutar a los microservicios Java (gRPC).
# Incluye: JWT Authentication, Rate Limiting y Transcodificación gRPC.

static_resources:
  # ---------------------------------------------------------
  # 1. LISTENERS (Escuchadores)
  # Definen en qué puerto se va a quedar Envoy escuchando peticiones.
  # ---------------------------------------------------------
  listeners:
    - name: listener_comercio
      address:
        # Aquí le decimos a Envoy que escuche en el puerto 8082 en todas las interfaces de red (0.0.0.0).
        socket_address: { address: 0.0.0.0, port_value: 8082 }
      filter_chains:
        - filters:
            # Este es el filtro principal de Envoy que sabe cómo manejar tráfico HTTP
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                
                # ---------------------------------------------------------
                # 2. ROUTE CONFIG (Configuración de Rutas)
                # Define a qué cluster (microservicio) enviar cada petición.
                # ---------------------------------------------------------
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: backend
                      domains: ["*"] # Acepta peticiones de cualquier dominio
                      
                      # CORS: Permite que un frontend web (Angular, React, etc.) llame a esta API
                      # sin que el navegador bloquee la petición por seguridad.
                      cors:
                        allow_origin_string_match:
                          - safe_regex: { regex: "^http://localhost(:[0-9]+)?$" }
                          - safe_regex: { regex: "^http://127\\.0\\.0\\.1(:[0-9]+)?$" }
                        allow_methods: "GET, POST, PUT, DELETE, OPTIONS"
                        allow_headers: "Content-Type, Authorization"
                        max_age: "1728000"
                        expose_headers: "grpc-status, grpc-message"
                      
                      # RUTAS: Aquí Envoy lee la ruta y decide a dónde mandarla.
                      routes:
                        # Auth routes (públicas - no requieren JWT)
                        - match: { prefix: "/profeco.auth.v1.AuthService/" }
                          route:
                            cluster: ms-auth
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/api/auth/" }
                          route:
                            cluster: ms-auth
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/profeco.comercio.v1.ComercioService/" }
                          route:
                            cluster: ms-comercio
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/profeco.catalogo.v1.CatalogoService/" }
                          route:
                            cluster: ms-catalogo
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/profeco.ofertas.v1.OfertasService/" }
                          route:
                            cluster: ms-ofertas
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/profeco.resenias.v1.ReseniasService/" }
                          route:
                            cluster: ms-resenias
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/profeco.usuarios.v1.UsuariosService/" }
                          route:
                            cluster: ms-usuarios
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        - match: { prefix: "/profeco.multas.v1.MultasService/" }
                          route:
                            cluster: ms-multas
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                        # Catch-all para que las peticiones OPTIONS (CORS preflight) encuentren una ruta válida
                        - match: { prefix: "/" }
                          route:
                            cluster: ms-comercio
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3

                # ---------------------------------------------------------
                # 3. HTTP FILTERS (Filtros HTTP)
                # ---------------------------------------------------------
                http_filters:
                  # Filtro para procesar CORS
                  - name: envoy.filters.http.cors
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors }
                  
                  # Rate Limiting Local (100 req/min por defecto)
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                      token_bucket:
                        max_tokens: 100
                        tokens_per_fill: 100
                        fill_interval: 60s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value: { numerator: 100, denominator: HUNDRED }
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value: { numerator: 100, denominator: HUNDRED }

                  # JWT Authentication (valida tokens antes de pasar al microservicio)
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        profeco_auth:
                          issuer: "profeco-auth-service"
                          forward: true
                          remote_jwks:
                            http_uri:
                              uri: "http://ms-auth:8098/.well-known/jwks.json"
                              cluster: ms-auth-jwks
                              timeout: 15s
                            cache_duration: 300s
                      rules:
                        # Rutas públicas (sin JWT requerido)
                        - match: { prefix: "/api/auth/" }
                        - match: { prefix: "/profeco.auth.v1.AuthService/" }
                        - match: { prefix: "/api/usuarios/ping" }
                        # Todo lo demás requiere JWT válido
                        - match: { prefix: "/" }
                          requires: { provider_name: "profeco_auth" }

                  # TRANSCODIFICADOR gRPC-JSON
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: "/etc/envoy/proto/gateway-comercio.pb"
                      services:
                        - "profeco.comercio.v1.ComercioService"
                        - "profeco.catalogo.v1.CatalogoService"
                        - "profeco.ofertas.v1.OfertasService"
                        - "profeco.resenias.v1.ReseniasService"
                        - "profeco.usuarios.v1.UsuariosService"
                        - "profeco.multas.v1.MultasService"
                        - "profeco.auth.v1.AuthService"
                  
                  # El enrutador final que despacha la petición al cluster elegido en el paso 2
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }

  # ---------------------------------------------------------
  # 4. CLUSTERS (Destinos Backend)
  # ---------------------------------------------------------
  clusters:
    # Cluster del MS Comercio (gRPC en puerto 9092)
    - name: ms-comercio
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options: { envoy.extensions.upstreams.http.v3.HttpProtocolOptions: { "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: { http2_protocol_options: {} } } }
      load_assignment: { cluster_name: ms-comercio, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-comercio, port_value: 9092 } } } }] }] }    
    
    # Cluster del MS Catálogo (gRPC en puerto 9091)
    - name: ms-catalogo
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options: { envoy.extensions.upstreams.http.v3.HttpProtocolOptions: { "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: { http2_protocol_options: {} } } }
      load_assignment: { cluster_name: ms-catalogo, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-catalogo, port_value: 9091 } } } }] }] }

    # Cluster del MS Ofertas (gRPC en puerto 9095)
    - name: ms-ofertas
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options: { envoy.extensions.upstreams.http.v3.HttpProtocolOptions: { "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: { http2_protocol_options: {} } } }
      load_assignment: { cluster_name: ms-ofertas, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-ofertas, port_value: 9095 } } } }] }] }
    
    # Cluster del MS Reseñas (gRPC en puerto 9094)
    - name: ms-resenias
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options: { envoy.extensions.upstreams.http.v3.HttpProtocolOptions: { "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: { http2_protocol_options: {} } } }
      load_assignment: { cluster_name: ms-resenias, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-resenias, port_value: 9094 } } } }] }] }

    # Cluster del MS Usuarios (gRPC en puerto 9096)
    - name: ms-usuarios
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options: { envoy.extensions.upstreams.http.v3.HttpProtocolOptions: { "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: { http2_protocol_options: {} } } }
      load_assignment: { cluster_name: ms-usuarios, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-usuarios, port_value: 9096 } } } }] }] }

    # Cluster del MS Multas (gRPC en puerto 9097)
    - name: ms-multas
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options: { envoy.extensions.upstreams.http.v3.HttpProtocolOptions: { "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: { http2_protocol_options: {} } } }
      load_assignment: { cluster_name: ms-multas, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-multas, port_value: 9097 } } } }] }] }

    # Cluster del MS Auth (gRPC en puerto 9098)
    - name: ms-auth
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options: { envoy.extensions.upstreams.http.v3.HttpProtocolOptions: { "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: { http2_protocol_options: {} } } }
      load_assignment: { cluster_name: ms-auth, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-auth, port_value: 9098 } } } }] }] }

    # Cluster del MS Auth JWKS (HTTP/1.1 en puerto 8098 para el endpoint JWKS)
    - name: ms-auth-jwks
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment: { cluster_name: ms-auth-jwks, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ms-auth, port_value: 8098 } } } }] }] }
