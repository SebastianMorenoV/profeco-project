syntax = "proto3";

import "google/api/annotations.proto";

option java_multiple_files = true;
option java_package = "com.mycompany.grpc.usuarios";
option java_outer_classname = "UsuariosProto";

package profeco.usuarios.v1;

// =============================================
// SERVICIO DE USUARIOS
// =============================================
service UsuariosService {

  rpc Ping(Empty) returns (PingResponse) {
    option (google.api.http) = {
      get: "/api/usuarios/ping"
    };
  }

  rpc RegistrarUsuario(RegistrarUsuarioRequest) returns (UsuarioResponse) {
    option (google.api.http) = {
      post: "/api/usuarios"
      body: "*"
    };
  }

  rpc ObtenerUsuario(IdRequest) returns (UsuarioResponse) {
    option (google.api.http) = {
      get: "/api/usuarios/{id}"
    };
  }

  rpc ListarUsuarios(ListarUsuariosRequest) returns (ListaUsuariosResponse) {
    option (google.api.http) = {
      get: "/api/usuarios"
    };
  }

  rpc ActualizarUsuario(ActualizarUsuarioRequest) returns (UsuarioResponse) {
    option (google.api.http) = {
      put: "/api/usuarios/{id}"
      body: "*"
    };
  }

  rpc EliminarUsuario(IdRequest) returns (MensajeResponse) {
    option (google.api.http) = {
      delete: "/api/usuarios/{id}"
    };
  }

  rpc BuscarPorEmail(EmailRequest) returns (UsuarioResponse) {
    option (google.api.http) = {
      get: "/api/usuarios/email/{email}"
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/usuarios/login"
      body: "*"
    };
  }

  rpc CambiarPassword(CambiarPasswordRequest) returns (MensajeResponse) {
    option (google.api.http) = {
      put: "/api/usuarios/{id}/password"
      body: "*"
    };
  }

  // ===== FCM TOKENS =====
  // Registra el token FCM de un dispositivo del usuario.
  rpc RegistrarFcmToken(RegistrarFcmTokenRequest) returns (MensajeResponse) {
    option (google.api.http) = {
      post: "/api/usuarios/{usuario_id}/fcm-token"
      body: "*"
    };
  }

  // Llamado por el servicio de notificaciones para resolver a quién mandar push
  // cuando un comercio publica una oferta. Devuelve los tokens de los usuarios
  // que tienen ese comercio en favoritos.
  rpc ListarFcmTokensPorComercio(IdRequest) returns (ListaTokensResponse) {}

  // ===== COMERCIOS FAVORITOS =====
  rpc ListarComerciosFavoritos(IdRequest) returns (ListaIdsResponse) {
    option (google.api.http) = {
      get: "/api/usuarios/{id}/comercios-favoritos"
    };
  }

  // Reemplaza el set completo de comercios favoritos del usuario.
  rpc SyncComerciosFavoritos(SyncIdsRequest) returns (ListaIdsResponse) {
    option (google.api.http) = {
      put: "/api/usuarios/{usuario_id}/comercios-favoritos"
      body: "*"
    };
  }

  // ===== WISHLIST DE PRODUCTOS =====
  rpc ListarWishlist(IdRequest) returns (ListaIdsResponse) {
    option (google.api.http) = {
      get: "/api/usuarios/{id}/wishlist"
    };
  }

  rpc SyncWishlist(SyncIdsRequest) returns (ListaIdsResponse) {
    option (google.api.http) = {
      put: "/api/usuarios/{usuario_id}/wishlist"
      body: "*"
    };
  }

  // ===== LISTA DE COMPRAS =====
  rpc ListarListaCompras(IdRequest) returns (ListaItemsComprasResponse) {
    option (google.api.http) = {
      get: "/api/usuarios/{id}/lista-compras"
    };
  }

  rpc SyncListaCompras(SyncListaComprasRequest) returns (ListaItemsComprasResponse) {
    option (google.api.http) = {
      put: "/api/usuarios/{usuario_id}/lista-compras"
      body: "*"
    };
  }
}

// =============================================
// MENSAJES
// =============================================
message Empty {}

message PingResponse {
  string mensaje = 1;
}

message MensajeResponse {
  string mensaje = 1;
  bool exito = 2;
}

message IdRequest {
  int64 id = 1;
}

message EmailRequest {
  string email = 1;
}

message RegistrarUsuarioRequest {
  string nombre = 1;
  string apellido = 2;
  string email = 3;
  string telefono = 4;
  string tipo_usuario = 5; // CONSUMIDOR, COMERCIANTE, PROFECO
  string password = 6;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  bool exito = 1;
  string mensaje = 2;
  Usuario usuario = 3;
}

message CambiarPasswordRequest {
  int64 id = 1;
  string password_actual = 2;
  string password_nuevo = 3;
}

message ActualizarUsuarioRequest {
  int64 id = 1;
  string nombre = 2;
  string apellido = 3;
  string email = 4;
  string telefono = 5;
}

message ListarUsuariosRequest {
  string tipo_usuario = 1; // filtro opcional
}

message Usuario {
  int64 id = 1;
  string nombre = 2;
  string apellido = 3;
  string email = 4;
  string telefono = 5;
  string tipo_usuario = 6;
  bool activo = 7;
  string fecha_registro = 8;
}

message UsuarioResponse {
  Usuario usuario = 1;
}

message ListaUsuariosResponse {
  repeated Usuario usuarios = 1;
}

// ===== FCM =====

message RegistrarFcmTokenRequest {
  int64 usuario_id = 1;
  string token = 2;
  string plataforma = 3; // ANDROID / IOS / WEB
}

message ListaTokensResponse {
  repeated string tokens = 1;
}

// ===== Sync de listas de IDs (favoritos / wishlist) =====

message SyncIdsRequest {
  int64 usuario_id = 1;
  repeated int64 ids = 2;
}

message ListaIdsResponse {
  int64 usuario_id = 1;
  repeated int64 ids = 2;
}

// ===== Lista de compras =====

message ItemListaCompras {
  int32 id_local = 1;
  string nombre = 2;
  bool marcado = 3;
}

message SyncListaComprasRequest {
  int64 usuario_id = 1;
  repeated ItemListaCompras items = 2;
}

message ListaItemsComprasResponse {
  int64 usuario_id = 1;
  repeated ItemListaCompras items = 2;
}
